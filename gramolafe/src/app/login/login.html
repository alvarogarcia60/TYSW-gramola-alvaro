<div class="login-page">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Introduce tu email">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Tu contraseña">
    </div>

    <button class="btn-primary" (click)="doLogin()">Entrar</button>

    <div class="messages">
      <p *ngIf="ok" class="msg-ok">{{ ok }}</p>
      <p *ngIf="err" class="msg-err">{{ err }}</p>
    </div>

    <hr>

    <div class="register-section">
      <p>¿Aún no tienes cuenta?</p>
      <button class="btn-secondary" (click)="goToRegister()">Registrarme</button>
    </div>
  </div>
</div>
