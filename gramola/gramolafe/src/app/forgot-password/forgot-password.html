<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="card-header">
      <h2>🔐 Recuperar Contraseña</h2>
      <p>Ingresa tu email para recibir un enlace de recuperación</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <label for="email">Email registrado</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@email.com"
          required
          [disabled]="isLoading"
        />
      </div>

      @if (errorMessage) {
        <div class="error-message">
          ❌ {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="success-message">
          ✅ {{ successMessage }}
        </div>
      }

      <div class="button-group">
        <button type="submit" class="btn-submit" [disabled]="isLoading">
          @if (isLoading) {
            Enviando...
          } @else {
            Enviar Enlace de Recuperación
          }
        </button>
        <button type="button" class="btn-back" (click)="goBack()" [disabled]="isLoading">
          Volver al Login
        </button>
      </div>
    </form>

    <div class="info-box">
      <p>📧 Recibirás un correo con un enlace válido por 24 horas para cambiar tu contraseña.</p>
    </div>
  </div>
</div>
