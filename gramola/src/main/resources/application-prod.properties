# Production profile - no fallbacks, requires env variables

# Stripe secret key must be provided via environment
stripe.secret=${STRIPE_SECRET_KEY}

# MySQL connection (required in prod)
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# JPA strategy (consider 'validate' for strict schema checks)
spring.jpa.hibernate.ddl-auto=update

# Optional: server port override
# server.port=${SERVER_PORT}
